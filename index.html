<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Recipe Box</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Figtree:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* ============================================================
   THE RECIPE BOX — single-file recipe collection
   To add a recipe: append one object to the RECIPES array at the
   bottom of this file. Nothing else needs to change.
   ============================================================ */
:root{
  --ink:#241205;
  --cream:#FFF1D4;
  --paper:#FFFDF6;
  --bg:#22102C;
  --muted:#6B5340;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#150720; } }
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:17px;line-height:1.5;-webkit-text-size-adjust:100%;
}
img,svg{max-width:100%}
a{color:inherit}
.wrap{max-width:880px;margin:0 auto;padding:18px 14px 64px}

/* ---------- top bar ---------- */
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:9px;color:var(--cream);font-weight:800;font-size:15px;text-decoration:none}
.brand svg{width:26px;height:26px;flex:none}
.btn{
  display:inline-flex;align-items:center;gap:8px;background:var(--pop,#F5B301);color:var(--ink);
  text-decoration:none;font-weight:800;font-size:14px;padding:9px 14px;border-radius:999px;
  border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink);cursor:pointer;font-family:inherit;
}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid #F5B301;outline-offset:3px}

/* ---------- index ---------- */
.masthead{margin:8px 0 22px}
.masthead h1{
  font-family:"Bricolage Grotesque","Figtree",sans-serif;font-weight:800;letter-spacing:-.03em;
  font-size:clamp(36px,10vw,64px);line-height:.9;margin:0 0 8px;color:var(--cream);
}
.masthead p{margin:0;color:#C9B0D6;font-size:15px;max-width:52ch}

.home{display:grid;grid-template-columns:1fr;gap:18px;align-items:start}
@media(min-width:900px){.home{grid-template-columns:200px 1fr;gap:24px}}

/* ---------- sidebar ---------- */
.side{border:2px solid rgba(255,241,212,.22);background:rgba(255,241,212,.05);border-radius:16px;padding:6px 12px 12px}
.side > summary{list-style:none;cursor:pointer;color:var(--cream);font-family:"Bricolage Grotesque",sans-serif;
  font-weight:800;font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;padding:8px 2px}
.side > summary::-webkit-details-marker{display:none}
.side > summary::after{content:"▾";float:right}
.side[open] > summary::after{content:"▴"}
@media(min-width:900px){
  .side{position:sticky;top:10px;max-height:calc(100vh - 28px);overflow:auto}
  .side > summary{display:none}
  .side:not([open]) > .sidebody{display:block}
}
.sidegroup{margin:10px 0 0}
.sidegroup > summary{list-style:none;cursor:pointer;color:#F5B301;font-family:"Bricolage Grotesque",sans-serif;
  font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:800;padding:5px 2px;
  border-bottom:1px solid rgba(255,241,212,.18)}
.sidegroup > summary::-webkit-details-marker{display:none}
.sidegroup small{opacity:.55;font-weight:600;letter-spacing:0}
.sidelist{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:1px}
.sidelist a{display:block;text-decoration:none;color:#E6D6C2;font-size:13px;line-height:1.3;padding:4px 6px;border-radius:8px}
.sidelist a:hover,.sidelist a:focus-visible{background:rgba(255,241,212,.14);color:var(--cream)}

.cat{font-family:"Bricolage Grotesque",sans-serif;font-size:13px;letter-spacing:.14em;text-transform:uppercase;
  color:#C9B0D6;margin:24px 0 10px;display:flex;align-items:center;gap:10px;scroll-margin-top:12px}
.cat:first-of-type{margin-top:0}
.cat::after{content:"";flex:1;height:2px;background:rgba(255,241,212,.2)}

.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(136px,1fr))}
.tile{
  display:block;text-decoration:none;background:var(--paper);border:2.5px solid var(--ink);
  border-radius:14px;overflow:hidden;color:var(--ink);
}
.tile .top{background:var(--accent);padding:6px 8px 0}
.tile .thumb{display:block;width:100%;margin-bottom:-3px}
.tile .body{padding:8px 10px 10px}
.tile h3{font-family:"Bricolage Grotesque",sans-serif;font-size:14.5px;line-height:1.12;margin:0 0 6px;letter-spacing:-.015em}
.chip{background:var(--cream);border:2px solid var(--ink);border-radius:999px;padding:2px 7px;font-size:10.5px;font-weight:800;white-space:nowrap}

/* ---------- card ---------- */
.card{background:var(--paper);border-radius:26px;overflow:hidden;border:3px solid var(--ink)}
.hero{background:var(--accent);padding:22px 20px 0}
.hero .tags{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px}
.tag{background:var(--pop);color:var(--ink);font-weight:800;font-size:12px;padding:5px 11px;border-radius:999px;border:2px solid var(--ink)}
.tag.pale{background:var(--cream)}
.card h1{
  font-family:"Bricolage Grotesque","Figtree",sans-serif;font-weight:800;
  font-size:clamp(32px,9.5vw,54px);line-height:.95;margin:0 0 10px;color:var(--cream);letter-spacing:-.025em;
}
.kicker{color:rgba(255,241,212,.88);font-weight:600;font-size:15px;margin:0 0 18px;max-width:46ch}
.scene{display:block;margin:0 auto;width:min(360px,88%)}

.facts{display:grid;grid-template-columns:repeat(4,1fr);background:var(--ink);color:var(--cream);text-align:center}
.fact{padding:12px 4px;border-left:1px solid rgba(255,241,212,.25)}
.fact:first-child{border-left:0}
.fact b{display:block;font-family:"Bricolage Grotesque",sans-serif;font-size:19px;line-height:1.1}
.fact span{font-size:11px;opacity:.8;font-weight:600}

.section{padding:24px 20px}
.section + .section{border-top:3px dashed rgba(36,18,5,.18)}
h2{font-family:"Bricolage Grotesque","Figtree",sans-serif;font-size:27px;margin:0 0 4px;letter-spacing:-.02em}
.sub{margin:0 0 18px;font-size:14px;color:var(--muted)}

.servings{display:flex;align-items:center;gap:12px;background:var(--cream);border:2px solid var(--ink);border-radius:16px;padding:10px 14px;margin-bottom:20px}
.servings p{margin:0;font-weight:800;font-size:14px;flex:1}
.servings small{display:block;font-weight:600;color:var(--muted);font-size:12px}
.stepper{display:flex;align-items:center;gap:4px}
.stepper button{width:34px;height:34px;border-radius:10px;border:2px solid var(--ink);background:var(--pop);color:var(--ink);font-size:20px;font-weight:800;line-height:1;cursor:pointer;font-family:inherit}
.stepper button[disabled]{opacity:.35;cursor:not-allowed}
.stepper output{min-width:2.4ch;text-align:center;font-family:"Bricolage Grotesque",sans-serif;font-size:22px;font-weight:800}

.grouptitle{font-weight:800;font-size:13px;color:var(--accent);margin:18px 0 8px}
.grouptitle:first-of-type{margin-top:0}
ul.ings{list-style:none;margin:0;padding:0;display:grid;gap:8px;grid-template-columns:1fr}
@media(min-width:620px){ul.ings{grid-template-columns:1fr 1fr}}
.ing{display:flex;align-items:center;gap:11px;background:var(--cream);border:2px solid var(--ink);border-radius:14px;padding:8px 12px}
.ing .pic{width:40px;height:40px;flex:none;border-radius:10px;background:var(--paper);border:2px solid var(--ink);display:grid;place-items:center}
.ing .pic svg{width:26px;height:26px}
.ing .txt{font-size:14px;line-height:1.25}
.ing .amt{font-weight:800;display:block;font-size:15px}
.ing .opt{color:var(--muted);font-weight:600}

ol.steps{list-style:none;counter-reset:s;margin:0;padding:0;display:grid;gap:14px}
ol.steps li{counter-increment:s;display:flex;gap:13px;align-items:flex-start}
ol.steps li::before{
  content:counter(s);flex:none;width:38px;height:38px;border-radius:12px;
  background:var(--deep);color:var(--cream);border:2px solid var(--ink);
  display:grid;place-items:center;font-family:"Bricolage Grotesque",sans-serif;font-size:19px;font-weight:800;
}
ol.steps li:nth-child(3n+2)::before{background:var(--pop);color:var(--ink)}
ol.steps li:nth-child(3n+3)::before{background:var(--accent);color:var(--cream)}
.step h3{margin:6px 0 3px;font-size:16px;font-weight:800}
.step p{margin:0;font-size:15px;color:#3A2512}
.step p strong{font-weight:800;color:var(--accent)}
.time{display:inline-block;margin-top:6px;background:var(--pop);border:2px solid var(--ink);border-radius:999px;padding:2px 10px;font-size:12px;font-weight:800}

.tips{background:var(--deep);color:var(--cream)}
.tips h2{color:var(--pop)}
.tips .sub{color:rgba(255,241,212,.75)}
.tips ul{margin:0;padding-left:20px;display:grid;gap:9px;font-size:15px}
.tips b{color:var(--pop)}
.foot{padding:16px 20px;background:var(--ink);color:#D8C4AC;font-size:12px}
.foot a{color:var(--pop)}

/* ---------- A4 sheet ---------- */
.sheet{display:none;background:var(--paper);color:var(--ink);border-radius:8px;padding:14mm;border:3px solid var(--ink)}
body.show-sheet .sheet{display:block}
body.show-sheet .card{display:none}
.sheet-h{border-bottom:4px solid var(--accent);padding-bottom:8px;margin-bottom:12px}
.sheet-h h2{font-size:30px;margin:0;color:var(--accent)}
.sheet-h p{margin:4px 0 0;font-size:12px;font-weight:600}
.sheet-cols{display:grid;grid-template-columns:1fr;gap:16px}
@media(min-width:700px){.sheet-cols{grid-template-columns:34% 1fr}}
.sheet-cols h3{font-family:"Bricolage Grotesque",sans-serif;font-size:16px;margin:0 0 6px}
.sheet-list{list-style:none;margin:0 0 12px;padding:0;font-size:12px;line-height:1.55}
.sheet-list li{padding:2px 0;border-bottom:1px dotted #C9B69C}
.sheet-steps{margin:0;padding-left:18px;font-size:12px;line-height:1.5;display:grid;gap:7px}
.sheet-steps b{display:block}
.sheet-steps strong{font-weight:700}
.backlink{margin-top:14px;display:inline-block;font-weight:800;font-size:13px;color:var(--accent);cursor:pointer}

@media print{
  @page{size:A4;margin:12mm}
  body{background:#fff;font-size:10.5pt;padding:0}
  .wrap{padding:0;max-width:none}
  .bar,.card,.backlink,.btn,.masthead,.grid,.cat,.side{display:none !important}
  .sheet{display:block !important;border:0;padding:0;border-radius:0}
  .sheet-cols{grid-template-columns:34% 1fr;gap:10mm}
  .sheet-list,.sheet-steps{font-size:9.5pt}
}
@media(prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
</style>
</head>

{

  groups:[

  steps:[
    { h:"Oven and tin", t:"190°C. Grease a standard 12-hole muffin tin or line it.", time:"10 min" },

    { h:"Mash the bananas", t:"Add the <strong>bananas</strong> and mash them in, leaving some lumps. Completely smooth makes a denser muffin." },

  tips:[
    ["Black bananas only.","Yellow ones have not converted enough starch to sugar. If yours aren't there, bake them at 180°C for 15 minutes and cool."],

/* ============================================================
   4. ENGINE — no need to touch anything below when adding recipes.
   ============================================================ */
const app = document.getElementById("app");
const servesState = {};
const FRAC = [[1,"1"],[0.75,"¾"],[0.6667,"⅔"],[0.5,"½"],[0.3333,"⅓"],[0.25,"¼"],[0.125,"⅛"]];

function fmt(n, unit, round){
  if (!unit) return "";
  if (unit === "g" || unit === "ml"){
    const v = n >= 100 ? Math.round(n/5)*5 : Math.round(n);
    return v + " " + unit;
  }
  if (round){
    const v = Math.max(1, Math.round(n));
    return v + " " + (v === 1 ? unit.replace(/s$/,"") : unit);
  }
  const whole = Math.floor(n + 1e-9);
  let rem = n - whole, frac = "", best = null, diff = 1;
  for (const [v,s] of FRAC){ const d = Math.abs(rem - v); if (d < diff){ diff = d; best = [v,s]; } }
  if (rem > 0.06 && best && diff < 0.09) frac = best[1];
  else if (rem > 0.06) return (Math.round(n*100)/100) + " " + unit;
  const num = (whole ? whole : "") + (frac ? (whole ? " " : "") + frac : (whole ? "" : "0"));
  return num + " " + unit;
}
const themeVars = t => `--accent:${t.accent};--pop:${t.pop};--deep:${t.deep}`;

const CAT_ORDER = ["Dinners","Desserts","Breakfast","Other"];
const slugify = s => s.toLowerCase().replace(/[^a-z0-9]+/g,"-");
const fullTitle = r => r.title + (r.title2 ? " " + r.title2 : "");
function catsInOrder(){
  return [...new Set(RECIPES.map(r => r.category))].sort((a,b) => {
    const ia = CAT_ORDER.indexOf(a), ib = CAT_ORDER.indexOf(b);
    return (ia < 0 ? 90 : ia) - (ib < 0 ? 90 : ib) || a.localeCompare(b);
  });
}
const inCat = c => RECIPES.filter(r => r.category === c)
  .sort((a,b) => fullTitle(a).localeCompare(fullTitle(b)));

function renderIndex(){
  document.body.classList.remove("show-sheet");
  const cats = catsInOrder();
  app.innerHTML = `
    <div class="bar">
      <span class="brand"><svg viewBox="0 0 32 32"><use href="#i-pot"/></svg> The Recipe Box</span>
      <span class="brand" style="opacity:.55;font-weight:600">${RECIPES.length} recipes</span>
    </div>
    <div class="masthead">
      <h1>The Recipe<br>Box</h1>
      <p>Everything worth cooking twice, stripped of the life story and the ads. Tap a tile, scale the servings, print an A4 sheet for the fridge.</p>
    </div>
    <div class="home">
      <details class="side">
        <summary>Find a recipe</summary>
        <div class="sidebody">${cats.map(c => {
          const list = inCat(c);
          return `<details class="sidegroup" open>
            <summary>${c} <small>${list.length}</small></summary>
            <ul class="sidelist">${list.map(r => `<li><a href="#/${r.id}">${fullTitle(r)}</a></li>`).join("")}</ul>
          </details>`;
        }).join("")}</div>
      </details>
      <div>${cats.map(c => `
        <p class="cat" id="cat-${slugify(c)}">${c}</p>
        <div class="grid">${inCat(c).map(r => {
          const t = THEMES[r.theme];
          return `<a class="tile" href="#/${r.id}" title="${r.blurb.replace(/"/g,"&quot;")}" style="${themeVars(t)}">
            <div class="top"><svg class="thumb" viewBox="0 0 400 258" aria-hidden="true">${SCENE[r.scene](t)}</svg></div>
            <div class="body"><h3>${fullTitle(r)}</h3><span class="chip">${r.tags[1] || r.tags[0]}</span></div>
          </a>`;
        }).join("")}</div>`).join("")}</div>
    </div>
  `;
  window.scrollTo(0,0);
}

function renderRecipe(r){
  const t = THEMES[r.theme];
  if (servesState[r.id] === undefined) servesState[r.id] = r.base;
  app.innerHTML = `
    <div class="bar" style="${themeVars(t)}">
      <a class="brand" href="#/"><svg viewBox="0 0 32 32"><use href="#${r.icon}"/></svg> ← All recipes</a>
      <button class="btn" id="toSheet">A4 print sheet</button>
    </div>

    <article class="card" style="${themeVars(t)}">
      <header class="hero">
        <div class="tags">${r.tags.map((x,i) => `<span class="tag${i ? " pale" : ""}">${x}</span>`).join("")}</div>
        <h1>${r.title}${r.title2 ? "<br>" + r.title2 : ""}</h1>
        <p class="kicker">${r.kicker}</p>
        <svg class="scene" viewBox="0 0 400 270" role="img" aria-label="Illustration of ${r.title}">${SCENE[r.scene](t)}</svg>
      </header>

      <div class="facts">
        ${r.facts.map(f => `<div class="fact"><b>${f[0]}</b><span>${f[1]}</span></div>`).join("")}
        <div class="fact"><b id="factServes"></b><span>SERVES</span></div>
      </div>

      <section class="section">
        <h2>What's in the box</h2>
        <p class="sub">${r.intro} Amounts update with the serving count.</p>
        <div class="servings">
          <p>Servings<small>${r.servingNote}</small></p>
          <div class="stepper">
            <button type="button" id="minus" aria-label="Fewer servings">−</button>
            <output id="servesOut" aria-live="polite"></output>
            <button type="button" id="plus" aria-label="More servings">+</button>
          </div>
        </div>
        <div id="ingHost"></div>
      </section>

      <section class="section">
        <h2>How to make it</h2>
        <p class="sub">${r.methodIntro}</p>
        <ol class="steps">${r.steps.map(s => `
          <li><div class="step"><h3>${s.h}</h3><p>${s.t}</p>
          ${s.time ? `<span class="time">⏱ ${s.time}</span>` : ""}</div></li>`).join("")}</ol>
      </section>

      <section class="section tips">
        <h2>Good to know</h2>
        <p class="sub">Small things that make a real difference.</p>
        <ul>${r.tips.map(x => `<li><b>${x[0]}</b> ${x[1]}</li>`).join("")}</ul>
      </section>

      <div class="foot">${r.source.note} Original at <a href="${r.source.url}">${r.source.name}</a>.</div>
    </article>

    <article class="sheet" style="${themeVars(t)}">
      <div class="sheet-h">
        <h2>${r.title} ${r.title2 || ""}</h2>
        <p>${r.sheetMeta} · Serves <span id="sheetServes"></span></p>
      </div>
      <div class="sheet-cols">
        <div><h3>Ingredients</h3><div id="sheetIngHost"></div></div>
        <div>
          <h3>Method</h3>
          <ol class="sheet-steps">${r.steps.map(s => `<li><b>${s.h}${s.time ? " — " + s.time : ""}</b>${s.t}</li>`).join("")}</ol>
          <h3 style="margin-top:12px">Notes</h3>
          <p style="font-size:12px;margin:0">${r.sheetNotes}</p>
        </div>
      </div>
      <a class="backlink" id="toCard">← Back to the full card</a>
    </article>
  `;

  const paint = () => {
    const serves = servesState[r.id];
    const scale = a => a * serves / r.base;
    document.getElementById("ingHost").innerHTML = r.groups.map(g => `
      <p class="grouptitle">${g.name}</p>
      <ul class="ings">${g.items.map(i => `
        <li class="ing">
          <span class="pic"><svg aria-hidden="true"><use href="#${i.icon}"/></svg></span>
          <span class="txt"><span class="amt">${i.amt ? fmt(scale(i.amt), i.unit, i.round) : "to taste"}</span>
          ${i.name}${i.opt ? ' <span class="opt">(optional)</span>' : ""}</span>
        </li>`).join("")}</ul>`).join("");
    document.getElementById("sheetIngHost").innerHTML = r.groups.map(g => `
      <h3 style="font-size:13px;margin:8px 0 4px">${g.name}</h3>
      <ul class="sheet-list">${g.items.map(i =>
        `<li><b>${i.amt ? fmt(scale(i.amt), i.unit, i.round) : ""}</b> ${i.name}${i.opt ? " (optional)" : ""}</li>`).join("")}</ul>`).join("");
    document.getElementById("servesOut").textContent = serves;
    document.getElementById("factServes").textContent = serves;
    document.getElementById("sheetServes").textContent = serves;
    document.getElementById("minus").disabled = serves <= r.min;
    document.getElementById("plus").disabled = serves >= r.max;
  };
  paint();

  document.getElementById("minus").addEventListener("click", () => { servesState[r.id] = Math.max(r.min, servesState[r.id] - r.step); paint(); });
  document.getElementById("plus").addEventListener("click", () => { servesState[r.id] = Math.min(r.max, servesState[r.id] + r.step); paint(); });
  document.getElementById("toSheet").addEventListener("click", () => {
    document.body.classList.add("show-sheet"); window.scrollTo(0,0);
    setTimeout(() => window.print(), 250);
  });
  document.getElementById("toCard").addEventListener("click", () => {
    document.body.classList.remove("show-sheet"); window.scrollTo(0,0);
  });
  window.scrollTo(0,0);
}

function route(){
  const id = (location.hash || "#/").replace(/^#\/?/, "").replace(/\/$/, "");
  const r = RECIPES.find(x => x.id === id);
  document.body.classList.remove("show-sheet");
  if (r) renderRecipe(r); else renderIndex();
}
window.addEventListener("hashchange", route);
route();
</script>
</body>
