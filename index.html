<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Recipe Box</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Figtree:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* ============================================================
   THE RECIPE BOX — single-file recipe collection
   To add a recipe: append one object to the RECIPES array at the
   bottom of this file. Nothing else needs to change.
   ============================================================ */
:root{
  --ink:#241205;
  --cream:#FFF1D4;
  --paper:#FFFDF6;
  --bg:#22102C;
  --muted:#6B5340;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#150720; } }
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:17px;line-height:1.5;-webkit-text-size-adjust:100%;
}
img,svg{max-width:100%}
a{color:inherit}
.wrap{max-width:880px;margin:0 auto;padding:18px 14px 64px}

/* ---------- top bar ---------- */
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:9px;color:var(--cream);font-weight:800;font-size:15px;text-decoration:none}
.brand svg{width:26px;height:26px;flex:none}
.btn{
  display:inline-flex;align-items:center;gap:8px;background:var(--pop,#F5B301);color:var(--ink);
  text-decoration:none;font-weight:800;font-size:14px;padding:9px 14px;border-radius:999px;
  border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink);cursor:pointer;font-family:inherit;
}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid #F5B301;outline-offset:3px}

/* ---------- index ---------- */
.masthead{margin:8px 0 22px}
.masthead h1{
  font-family:"Bricolage Grotesque","Figtree",sans-serif;font-weight:800;letter-spacing:-.03em;
  font-size:clamp(36px,10vw,64px);line-height:.9;margin:0 0 8px;color:var(--cream);
}
.masthead p{margin:0;color:#C9B0D6;font-size:15px;max-width:52ch}

.home{display:grid;grid-template-columns:1fr;gap:18px;align-items:start}
@media(min-width:900px){.home{grid-template-columns:200px 1fr;gap:24px}}

/* ---------- sidebar ---------- */
.side{border:2px solid rgba(255,241,212,.22);background:rgba(255,241,212,.05);border-radius:16px;padding:6px 12px 12px}
.side > summary{list-style:none;cursor:pointer;color:var(--cream);font-family:"Bricolage Grotesque",sans-serif;
  font-weight:800;font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;padding:8px 2px}
.side > summary::-webkit-details-marker{display:none}
.side > summary::after{content:"▾";float:right}
.side[open] > summary::after{content:"▴"}
@media(min-width:900px){
  .side{position:sticky;top:10px;max-height:calc(100vh - 28px);overflow:auto}
  .side > summary{display:none}
  .side:not([open]) > .sidebody{display:block !important;content-visibility:visible !important}
}
.sidegroup{margin:10px 0 0}
.sidegroup > summary{list-style:none;cursor:pointer;color:#F5B301;font-family:"Bricolage Grotesque",sans-serif;
  font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:800;padding:5px 2px;
  border-bottom:1px solid rgba(255,241,212,.18)}
.sidegroup > summary::-webkit-details-marker{display:none}
.sidegroup small{opacity:.55;font-weight:600;letter-spacing:0}
.sidelist{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:1px}
.sidelist a{display:block;text-decoration:none;color:#E6D6C2;font-size:13px;line-height:1.3;padding:4px 6px;border-radius:8px}
.sidelist a:hover,.sidelist a:focus-visible{background:rgba(255,241,212,.14);color:var(--cream)}

.cat{font-family:"Bricolage Grotesque",sans-serif;font-size:13px;letter-spacing:.14em;text-transform:uppercase;
  color:#C9B0D6;margin:24px 0 10px;display:flex;align-items:center;gap:10px;scroll-margin-top:12px}
.cat:first-of-type{margin-top:0}
.cat::after{content:"";flex:1;height:2px;background:rgba(255,241,212,.2)}

.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(136px,1fr))}
.tile{
  display:block;text-decoration:none;background:var(--paper);border:2.5px solid var(--ink);
  border-radius:14px;overflow:hidden;color:var(--ink);
}
.tile .top{background:var(--accent);padding:6px 8px 0}
.tile .thumb{display:block;width:100%;margin-bottom:-3px}
.tile .body{padding:8px 10px 10px}
.tile h3{font-family:"Bricolage Grotesque",sans-serif;font-size:14.5px;line-height:1.12;margin:0 0 6px;letter-spacing:-.015em}
.chip{background:var(--cream);border:2px solid var(--ink);border-radius:999px;padding:2px 7px;font-size:10.5px;font-weight:800;white-space:nowrap}

/* ---------- favourites ---------- */
.tilewrap{position:relative}
.fav{
  position:absolute;top:7px;right:7px;width:30px;height:30px;padding:0;line-height:1;
  border-radius:999px;border:2px solid var(--ink);background:var(--paper);color:#8C7A62;
  font-size:15px;font-weight:800;cursor:pointer;font-family:inherit;
  display:grid;place-items:center;box-shadow:2px 2px 0 var(--ink);
}
.fav:active{transform:translate(1px,1px);box-shadow:1px 1px 0 var(--ink)}
.fav[aria-pressed="true"]{background:#F5B301;color:var(--ink)}
.fav.big{
  position:static;width:auto;height:auto;display:inline-flex;align-items:center;gap:6px;
  padding:9px 14px;font-size:14px;box-shadow:3px 3px 0 var(--ink);background:var(--cream);color:var(--ink);
}
.fav.big[aria-pressed="true"]{background:#F5B301}
.cat.fav-cat{color:#F5B301}
.favhint{margin:0 0 4px;color:#9B85A8;font-size:13.5px;max-width:46ch}

/* ---------- card ---------- */
.card{background:var(--paper);border-radius:26px;overflow:hidden;border:3px solid var(--ink)}
.hero{background:var(--accent);padding:22px 20px 0}
.hero .tags{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px}
.tag{background:var(--pop);color:var(--ink);font-weight:800;font-size:12px;padding:5px 11px;border-radius:999px;border:2px solid var(--ink)}
.tag.pale{background:var(--cream)}
.card h1{
  font-family:"Bricolage Grotesque","Figtree",sans-serif;font-weight:800;
  font-size:clamp(32px,9.5vw,54px);line-height:.95;margin:0 0 10px;color:var(--cream);letter-spacing:-.025em;
}
.kicker{color:rgba(255,241,212,.88);font-weight:600;font-size:15px;margin:0 0 18px;max-width:46ch}
.scene{display:block;margin:0 auto;width:min(360px,88%)}

.facts{display:grid;grid-template-columns:repeat(4,1fr);background:var(--ink);color:var(--cream);text-align:center}
.fact{padding:12px 4px;border-left:1px solid rgba(255,241,212,.25)}
.fact:first-child{border-left:0}
.fact b{display:block;font-family:"Bricolage Grotesque",sans-serif;font-size:19px;line-height:1.1}
.fact span{font-size:11px;opacity:.8;font-weight:600}

.section{padding:24px 20px}
.section + .section{border-top:3px dashed rgba(36,18,5,.18)}
h2{font-family:"Bricolage Grotesque","Figtree",sans-serif;font-size:27px;margin:0 0 4px;letter-spacing:-.02em}
.sub{margin:0 0 18px;font-size:14px;color:var(--muted)}

.servings{display:flex;align-items:center;gap:12px;background:var(--cream);border:2px solid var(--ink);border-radius:16px;padding:10px 14px;margin-bottom:20px}
.servings p{margin:0;font-weight:800;font-size:14px;flex:1}
.servings small{display:block;font-weight:600;color:var(--muted);font-size:12px}
.stepper{display:flex;align-items:center;gap:4px}
.stepper button{width:34px;height:34px;border-radius:10px;border:2px solid var(--ink);background:var(--pop);color:var(--ink);font-size:20px;font-weight:800;line-height:1;cursor:pointer;font-family:inherit}
.stepper button[disabled]{opacity:.35;cursor:not-allowed}
.stepper output{min-width:2.4ch;text-align:center;font-family:"Bricolage Grotesque",sans-serif;font-size:22px;font-weight:800}

.grouptitle{font-weight:800;font-size:13px;color:var(--accent);margin:18px 0 8px}
.grouptitle:first-of-type{margin-top:0}
ul.ings{list-style:none;margin:0;padding:0;display:grid;gap:8px;grid-template-columns:1fr}
@media(min-width:620px){ul.ings{grid-template-columns:1fr 1fr}}
.ing{display:flex;align-items:center;gap:11px;background:var(--cream);border:2px solid var(--ink);border-radius:14px;padding:8px 12px}
.ing .pic{width:40px;height:40px;flex:none;border-radius:10px;background:var(--paper);border:2px solid var(--ink);display:grid;place-items:center}
.ing .pic svg{width:26px;height:26px}
.ing .txt{font-size:14px;line-height:1.25}
.ing .amt{font-weight:800;display:block;font-size:15px}
.ing .opt{color:var(--muted);font-weight:600}

ol.steps{list-style:none;counter-reset:s;margin:0;padding:0;display:grid;gap:14px}
ol.steps li{counter-increment:s;display:flex;gap:13px;align-items:flex-start}
ol.steps li::before{
  content:counter(s);flex:none;width:38px;height:38px;border-radius:12px;
  background:var(--deep);color:var(--cream);border:2px solid var(--ink);
  display:grid;place-items:center;font-family:"Bricolage Grotesque",sans-serif;font-size:19px;font-weight:800;
}
ol.steps li:nth-child(3n+2)::before{background:var(--pop);color:var(--ink)}
ol.steps li:nth-child(3n+3)::before{background:var(--accent);color:var(--cream)}
.step h3{margin:6px 0 3px;font-size:16px;font-weight:800}
.step p{margin:0;font-size:15px;color:#3A2512}
.step p strong{font-weight:800;color:var(--accent)}
.time{display:inline-block;margin-top:6px;background:var(--pop);border:2px solid var(--ink);border-radius:999px;padding:2px 10px;font-size:12px;font-weight:800}

.tips{background:var(--deep);color:var(--cream)}
.tips h2{color:var(--pop)}
.tips .sub{color:rgba(255,241,212,.75)}
.tips ul{margin:0;padding-left:20px;display:grid;gap:9px;font-size:15px}
.tips b{color:var(--pop)}
.foot{padding:16px 20px;background:var(--ink);color:#D8C4AC;font-size:12px}
.foot a{color:var(--pop)}

/* ---------- A4 sheet ---------- */
.sheet{display:none;background:var(--paper);color:var(--ink);border-radius:8px;padding:14mm;border:3px solid var(--ink)}
body.show-sheet .sheet{display:block}
body.show-sheet .card{display:none}
.sheet-h{border-bottom:4px solid var(--accent);padding-bottom:8px;margin-bottom:12px}
.sheet-h h2{font-size:30px;margin:0;color:var(--accent)}
.sheet-h p{margin:4px 0 0;font-size:12px;font-weight:600}
.sheet-cols{display:grid;grid-template-columns:1fr;gap:16px}
@media(min-width:700px){.sheet-cols{grid-template-columns:34% 1fr}}
.sheet-cols h3{font-family:"Bricolage Grotesque",sans-serif;font-size:16px;margin:0 0 6px}
.sheet-list{list-style:none;margin:0 0 12px;padding:0;font-size:12px;line-height:1.55}
.sheet-list li{padding:2px 0;border-bottom:1px dotted #C9B69C}
.sheet-steps{margin:0;padding-left:18px;font-size:12px;line-height:1.5;display:grid;gap:7px}
.sheet-steps b{display:block}
.sheet-steps strong{font-weight:700}
.backlink{margin-top:14px;display:inline-block;font-weight:800;font-size:13px;color:var(--accent);cursor:pointer}

@media print{
  @page{size:A4;margin:12mm}
  body{background:#fff;font-size:10.5pt;padding:0}
  .wrap{padding:0;max-width:none}
  .bar,.card,.backlink,.btn,.masthead,.grid,.cat,.side,.fav,.favhint{display:none !important}
  .sheet{display:block !important;border:0;padding:0;border-radius:0}
  .sheet-cols{grid-template-columns:34% 1fr;gap:10mm}
  .sheet-list,.sheet-steps{font-size:9.5pt}
}
@media(prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
</style>
</head>

    { h:"Soften the aromatics", t:"Heat the <strong>vegetable oil</strong> in a large pot over medium. Cook the <strong>onion</strong> until soft, then stir in the <strong>ginger</strong>, <strong>garlic</strong>, <strong>carrot</strong> and <strong>capsicum</strong>.", time:"3–4 min" },
    { h:"Add spices and simmer", t:"Stir in the <strong>curry powder</strong>, <strong>cumin</strong>, <strong>turmeric</strong>, <strong>paprika</strong>, <strong>chilli flakes</strong> and <strong>sugar</strong>, then the <strong>lentils</strong> and <strong>stock</strong>. Bring to the boil, drop to a gentle simmer and cook until the lentils are tender but not collapsed.", time:"10 min" },

{

  facts:[["15 min","PREP"],["40 min","ROAST"],["200°C","OVEN"]],
  base:4, step:2, min:2, max:8,

  groups:[

  steps:[
    { h:"Oven on, rice on", t:"Heat the oven to 200 °C (180 °C fan). Start the <strong>rice</strong> in a rice cooker or pot and cook it according to the packet." },

    { h:"Roast the sweet potato", t:"Slick one or two large trays with <strong>olive oil</strong>, spread out the sweet potato in a single layer and season with <strong>salt</strong> and <strong>pepper</strong>. Roast until browning underneath.", time:"20 min" },
    { h:"Add the broccoli", t:"Flip and toss the sweet potato, add the <strong>broccoli</strong> to the tray, season again and roast until the broccoli is lightly charred at the edges and the sweet potato is bronzed and tender.", time:"10–20 min" },
    { h:"Toast the seeds", t:"In a small dry pan, toast the <strong>white sesame seeds</strong> and <strong>black sesame seeds</strong> until fragrant, then tip them out to cool.", time:"2–3 min" },

  tips:[

{
  id:"veggie-black-bean-enchiladas", category:"Dinners", theme:"chilli", scene:"tray", icon:"i-tortilla",
  title:"Veggie Black Bean", title2:"Enchiladas",
  blurb:"Broccoli, capsicum, spinach and black beans rolled up under red sauce and cheese.",
  kicker:"Not the quickest dinner, but worth the effort: sautéed capsicum, broccoli and spinach with black beans, rolled into tortillas, drowned in red sauce and baked until golden. Leftovers are lunch.",
  tags:["Vegetarian","Freezer-friendly","Makes 8"],
  facts:[["20 min","PREP"],["50 min","COOK"],["200°C","OVEN"]],
  base:4, step:2, min:2, max:8,
  servingNote:"Base recipe makes 8 enchiladas in a 33 × 23 cm dish",
  intro:"The sauce takes ten minutes and is worth making — everything else moves fast once the pan is hot.",
  methodIntro:"Sauce, filling, roll, bake. Rest before serving or you'll burn your mouth.",
  sheetMeta:"Vegetarian · Prep 20 min · Bake 20–26 min at 200 °C · 33 × 23 cm dish",
  groups:[
    { name:"Enchilada sauce (makes 500 ml)", items:[

      { icon:"i-sauce", name:"tomato paste", amt:35, unit:"g" },

    { name:"The filling", items:[
      { icon:"i-oil", name:"olive oil", amt:2, unit:"tbsp" },
      { icon:"i-onion", name:"red onion, chopped", amt:150, unit:"g" },
      { icon:"i-capsicum", name:"red capsicum, chopped", amt:150, unit:"g" },

      { icon:"i-spice", name:"ground cumin", amt:1, unit:"tsp" },
      { icon:"i-spice", name:"ground cinnamon", amt:0.25, unit:"tsp" },
      { icon:"i-salt", name:"salt and black pepper", amt:0, unit:"" }]},
    { name:"To assemble", items:[
      { icon:"i-sauce", name:"enchilada sauce, from above or bought", amt:500, unit:"ml" },
      { icon:"i-tortilla", name:"wholemeal tortillas, 20 cm", amt:8, unit:"tortillas", round:true },
      { icon:"i-cheese", name:"grated tasty or Monterey Jack", amt:120, unit:"g" },
      { icon:"i-herb", name:"coriander, chopped, to finish", amt:0, unit:"", opt:true }]}
  ],
  steps:[
    { h:"Make the sauce", t:"Mix the <strong>plain flour</strong>, <strong>chilli powder</strong>, <strong>cumin</strong>, <strong>garlic powder</strong>, <strong>oregano</strong>, <strong>salt</strong> and a pinch of <strong>cinnamon</strong> in a small bowl. Warm the <strong>olive oil</strong> in a pot over medium until a pinch of the mixture sizzles, tip it all in and whisk for a minute until it darkens, then whisk in the <strong>tomato paste</strong> and pour the <strong>vegetable stock</strong> in slowly, whisking out the lumps. Simmer until it thickens enough to resist the spoon, then take it off the heat and whisk in the <strong>apple cider vinegar</strong> and plenty of <strong>black pepper</strong>.", time:"10 min" },
    { h:"Heat the oven", t:"Heat the oven to 200 °C (180 °C fan), one rack in the middle and one in the upper third. Grease a 33 × 23 cm baking dish with a little <strong>olive oil</strong>." },
    { h:"Soften the vegetables", t:"Warm the <strong>olive oil</strong> in a large frying pan over medium. Cook the <strong>red onion</strong> with a pinch of <strong>salt</strong> until soft and translucent, then add the <strong>broccoli</strong> and <strong>capsicum</strong>, drop the heat to medium-low, cover and cook until the broccoli is bright green and just catching gold at the edges.", time:"13–16 min" },
    { h:"Spices, then greens", t:"Stir in the <strong>cumin</strong> and <strong>cinnamon</strong> until fragrant, about 30 seconds. Add the <strong>baby spinach</strong> a few handfuls at a time, stirring until each lot wilts." },
    { h:"Mix the filling", t:"Tip everything into a bowl. Stir through the <strong>black beans</strong>, a quarter of the <strong>cheese</strong> and a splash of <strong>enchilada sauce</strong>. Season with <strong>salt</strong> and <strong>black pepper</strong>." },
    { h:"Roll them up", t:"Pour a little <strong>enchilada sauce</strong> into the dish and tilt to coat the base. Spread about a cup of filling down the middle of a <strong>tortilla</strong>, fold one side over then the other, and set it seam-side down in the dish. Repeat with the rest." },
    { h:"Sauce and bake", t:"Drizzle the remaining <strong>enchilada sauce</strong> over, leaving the tips bare so they crisp, and scatter over the rest of the <strong>cheese</strong>. Bake uncovered on the middle rack, then move to the upper rack for a few minutes if you want more colour.", time:"20–26 min" },
    { h:"Rest, then serve", t:"Let them sit — they are volcanically hot straight from the oven. Scatter with <strong>coriander</strong> and serve.", time:"10 min rest" }
  ],
  tips:[
    ["Cinnamon is not a typo.","A quarter teaspoon does something quietly excellent to the filling. Don't skip it, don't double it."],
    ["Corn tortillas work.","You'll need about 12 rather than 8, and warm them first or they'll crack when you roll."],
    ["Make it vegan.","Skip the cheese entirely and top with sliced avocado or a drizzle of cashew cream."],
    ["Freeze before baking.","Assemble, chill until cold, then cover tightly and freeze up to six months. Bake from frozen, covered with foil, about 45 minutes."],
    ["The sauce keeps.","Five days in the fridge, three months frozen. Make a double batch — it is better than anything in a jar and takes ten minutes."]
  ],
  sheetNotes:"Sauce: toast the flour and spices in oil for a full minute before the stock goes in, and add the vinegar off the heat. It keeps 5 days, or 3 months frozen. Cinnamon in the filling is small but essential. Corn tortillas: use about 12 and warm them first. Vegan: skip cheese, top with avocado. Assemble and freeze unbaked for up to 6 months; bake from frozen, covered, about 45 min.",

}

{

  intro:"The bananas want to be properly black-spotted. Underripe ones make bland muffins.",

  steps:[

  facts:[["15 min","PREP"],["25 min","COOK"],["Tray + 2 pots","WASH-UP"]],

  steps:[
    { h:"Roast the vegetables", t:"200°C. Toss the <strong>broccoli</strong> and <strong>capsicum</strong> with the <strong>olive oil</strong> and <strong>salt</strong>, spread on a lined tray and roast until tender with caramelised edges, tossing halfway.", time:"25 min" },

    { h:"Garlic, briefly", t:"Add the <strong>garlic</strong> and stir constantly for about twenty seconds. No longer." },

  sheetNotes:"Add the spinach in handfuls — 340 g fits. Balsamic goes in off the heat. Season the finished bowl, not the parts; it wants about ½ tsp more salt. Vegan: olive oil for butter, skip the parmesan, add pine nuts. Keeps 3 days.",

{
  id:"vegan-cinnamon-rolls", category:"Breakfast", theme:"orchard", scene:"tray", icon:"i-flour",
  title:"Fluffy Vegan", title2:"Cinnamon Rolls",
  blurb:"Water, flour, yeast and oil. No butter, no milk, no mixer, no fuss.",
  kicker:"A very plain sweet dough that rises in an hour and bakes in fifteen minutes. The cinnamon filling is just sugar, cinnamon and olive oil rubbed on by hand. Fifteen minutes of actual work.",
  tags:["Vegan","1 hr 30","Makes 12"],
  facts:[["15 min","WORK"],["60 min","RISE"],["15 min","BAKE"]],
  base:12, step:2, min:6, max:24,
  servingNote:"Makes 10–12 large rolls. Best the day they're made.",
  intro:"Use refined olive oil, not extra virgin — you don't want to taste it.",
  methodIntro:"One rise in the bowl, a short second rise while the oven heats.",
  sheetMeta:"Vegan · 15 min work · 1 hr rise · Bake 200°C, 15 min",
  groups:[
    { name:"Sweet yeast dough", items:[
      { icon:"i-leaven", name:"dry yeast", amt:11, unit:"g" },
      { icon:"i-salt", name:"salt", amt:0.25, unit:"tsp" },
      { icon:"i-flour", name:"plain flour", amt:380, unit:"g" },
      { icon:"i-sugar", name:"raw sugar", amt:60, unit:"g" },
      { icon:"i-broth", name:"lukewarm water", amt:250, unit:"ml" },
      { icon:"i-oil", name:"refined olive oil", amt:15, unit:"ml" }
    ]},
    { name:"Cinnamon filling", items:[
      { icon:"i-sugar", name:"raw sugar", amt:70, unit:"g" },
      { icon:"i-spice", name:"ground cinnamon", amt:8, unit:"g" },
      { icon:"i-oil", name:"refined olive oil", amt:100, unit:"ml" },
      { icon:"i-chocolate", name:"dark vegan chocolate, melted, to drizzle", amt:60, unit:"g", opt:true }
    ]}
  ],
  steps:[
    { h:"Dry then wet", t:"Combine the <strong>yeast</strong>, <strong>salt</strong> and <strong>flour</strong> in a bowl. In another, stir the <strong>sugar</strong> into the lukewarm <strong>water</strong>, then pour it into the flour and stir with a spoon." },
    { h:"Knead", t:"Turn it out and knead by hand for a few minutes, then work in the <strong>olive oil</strong> for a minute more.", time:"4 min" },
    { h:"Rise", t:"Back into the bowl, covered with a tea towel, somewhere warm until roughly doubled.", time:"1 hr" },
    { h:"Mix the filling", t:"Stir the <strong>sugar</strong>, <strong>cinnamon</strong> and <strong>olive oil</strong> together into a loose paste and set it aside." },
    { h:"Roll it out", t:"Oven to 200°C. Knock the dough back briefly, then roll it into a large rectangle on a floured bench and spread the filling over it with your hands, right to the edges.", time:"10 min" },
    { h:"Roll and cut", t:"Roll it up into a log from the long side and cut 10–12 rolls. Sit them side by side in a greased deep baking dish." },
    { h:"Short second rise", t:"Cover and leave them while the oven comes up to temperature.", time:"10–15 min" },
    { h:"Bake", t:"Until the bottoms are golden brown. Drizzle with melted <strong>chocolate</strong> if you're going that way.", time:"15 min" }
  ],
  tips:[
    ["Lukewarm, not hot.","Water above about 45°C kills the yeast. It should feel like nothing on your wrist."],
    ["Refined olive oil.","Extra virgin is too strongly flavoured for a sweet dough. Any neutral oil works."],
    ["Side by side in a deep dish.","Crowded together they push upwards and stay soft. Spread out on a tray they dry out."],
    ["No icing here.","The filling is oil-based, so it stays moist without one. Melted dark chocolate if you want more."],
    ["Eat them the same day.","They stale fast. Leftovers are better warmed for a minute in a low oven."]
  ],
  sheetNotes:"Water lukewarm, not hot — hot water kills the yeast. Refined or neutral oil, not extra virgin. Pack the rolls side by side in a deep dish so they rise upwards and stay soft. Bake 200°C, 15 min. Best the day they're made.",
  source:{ name:"Vegansandra", url:"http://www.vegansandra.com/2016/04/fluffy-vegan-cinnamon-rolls.html", note:"Adapted from Vegansandra. Metric conversions are approximate." }
}

{
  id:"rice-noodle-bowls-almond-butter-tofu", category:"Dinners", theme:"sesame", scene:"bowl", icon:"i-tofu",

  facts:[["20 min","PREP"],["10 min","COOK"],["Pan + pot","WASH-UP"]],

      { icon:"i-chilli", name:"bird's eye chillies, crushed", amt:2, unit:"chillies", round:true },
      { icon:"i-syrup", name:"maple syrup", amt:30, unit:"ml" },
      { icon:"i-soy", name:"tamari", amt:20, unit:"ml" },

  steps:[
    { h:"Press the tofu", t:"Wrap the <strong>tofu</strong> in a clean tea towel and weigh it down with something heavy.", time:"10 min" },
    { h:"Mix the tofu sauce", t:"Whisk a third of the <strong>sesame oil</strong> with the <strong>almond butter</strong>, <strong>tamari</strong>, <strong>lime juice</strong>, <strong>maple syrup</strong> and crushed <strong>chillies</strong>. Taste and adjust." },
    { h:"Noodles", t:"Cook the <strong>rice noodles</strong> to the packet, rinse under cold water and drain thoroughly.", time:"5 min" },
    { h:"Prep the vegetables", t:"Ribbon the <strong>carrot</strong> with a peeler, slice the <strong>cucumber</strong>, <strong>capsicum</strong> and <strong>spring onions</strong>, tear the <strong>coriander</strong>." },
    { h:"Dressing", t:"Everything for the dressing into a jar — <strong>garlic</strong>, <strong>chillies</strong>, <strong>maple syrup</strong>, <strong>tamari</strong>, <strong>lime juice</strong>, <strong>rice vinegar</strong> and <strong>sesame oil</strong>. Shake hard, taste, adjust." },

{
  id:"hummus-that-changed-everything", category:"Other", theme:"herb", scene:"bowl", icon:"i-tahini",
  title:"The Hummus That", title2:"Changed Everything",
  blurb:"Far more lemon than you think is reasonable. That's the entire secret.",
  kicker:"Most homemade hummus is dull because it's under-lemoned and under-salted. This one uses most of two lemons. Blend the tahini and lemon juice together first and it whips up pale and creamy before anything else goes in.",
  tags:["Vegan","5 minutes","No cook"],
  facts:[["5 min","PREP"],["No cook","METHOD"],["1 processor","WASH-UP"]],
  base:8, step:2, min:2, max:16,
  servingNote:"Makes about 500 g. Keeps 4–5 days.",
  intro:"Keep the chickpea liquid from the tin — it's what loosens the hummus.",
  methodIntro:"One food processor. The only decision is how much salt.",
  sheetMeta:"Vegan · 5 minutes · No cook · Makes ~500 g",
  groups:[
    { name:"The hummus", items:[
      { icon:"i-beans", name:"cooked chickpeas, liquid reserved", amt:350, unit:"g" },
      { icon:"i-tahini", name:"tahini", amt:80, unit:"g" },
      { icon:"i-lemon", name:"lemon juice, freshly squeezed", amt:120, unit:"ml" },
      { icon:"i-garlic", name:"garlic", amt:2, unit:"cloves", round:true },
      { icon:"i-broth", name:"reserved chickpea liquid", amt:30, unit:"ml" },
      { icon:"i-chilli", name:"Tabasco", amt:0, unit:"", opt:true },
      { icon:"i-salt", name:"salt", amt:1, unit:"tsp" }
    ]},
    { name:"To finish", items:[
      { icon:"i-oil", name:"good olive oil, to drizzle", amt:0, unit:"" },
      { icon:"i-spice", name:"paprika, to dust", amt:0, unit:"" }
    ]}
  ],
  steps:[
    { h:"Tahini and lemon first", t:"Blend the <strong>tahini</strong> and <strong>lemon juice</strong> on their own until pale and whipped. This is the step that makes it creamy." },
    { h:"Everything else in", t:"Add the <strong>chickpeas</strong>, <strong>garlic</strong>, <strong>chickpea liquid</strong> and a few drops of <strong>Tabasco</strong>, and blend until coarsely pureed." },
    { h:"Salt slowly", t:"Add the <strong>salt</strong> in stages, tasting as you go. Tinned chickpeas are already salted; dried ones are not." },
    { h:"Check the texture", t:"Too stiff, add more <strong>chickpea liquid</strong> a spoon at a time. It firms up in the fridge, so leave it slightly loose." },
    { h:"Serve", t:"Into a bowl, dragged into a swirl with the back of a spoon, <strong>olive oil</strong> pooled in it and <strong>paprika</strong> dusted over." }
  ],
  tips:[
    ["Two cloves, not four.","The original called for four. It was too much and it gets sharper over the following days."],
    ["Whip the tahini first.","Tahini and lemon alone seize, then go pale and fluffy. Skip this and you get a grainy hummus."],
    ["The lemon is the point.","Most of two lemons. It tastes too sharp on a spoon and correct on bread."],
    ["Peel the chickpeas if you're patient.","Twenty minutes of slipping the skins off gives you restaurant-smooth hummus. Only worth it occasionally."],
    ["Four or five days.","Covered, in the fridge, with a film of olive oil on top to stop it drying out."]
  ],
  sheetNotes:"Whip the tahini and lemon juice alone first until pale — this is what makes it creamy. Two garlic cloves, not four. Salt in stages and taste. Leave it slightly loose; it firms in the fridge. Keeps 4–5 days under a film of oil.",
  source:{ name:"Oh She Glows", url:"https://ohsheglows.com/2010/12/04/the-hummus-that-changed-everything/", note:"Adapted from Angela Liddon, after Ina Garten. Metric conversions are approximate." }

const app = document.getElementById("app");
const servesState = {};
const FRAC = [[1,"1"],[0.75,"¾"],[0.6667,"⅔"],[0.5,"½"],[0.3333,"⅓"],[0.25,"¼"],[0.125,"⅛"]];

function fmt(n, unit, round){
  if (!unit) return "";
  if (unit === "g" || unit === "ml"){
    const v = n >= 100 ? Math.round(n/5)*5 : Math.round(n);
    return v + " " + unit;
  }
  if (round){
    const v = Math.max(1, Math.round(n));
    return v + " " + (v === 1 ? unit.replace(/s$/,"") : unit);
  }
  const whole = Math.floor(n + 1e-9);
  let rem = n - whole, frac = "", best = null, diff = 1;
  for (const [v,s] of FRAC){ const d = Math.abs(rem - v); if (d < diff){ diff = d; best = [v,s]; } }
  if (rem > 0.06 && best && diff < 0.09) frac = best[1];
  else if (rem > 0.06) return (Math.round(n*100)/100) + " " + unit;
  const num = (whole ? whole : "") + (frac ? (whole ? " " : "") + frac : (whole ? "" : "0"));
  return num + " " + unit;
}
const themeVars = t => `--accent:${t.accent};--pop:${t.pop};--deep:${t.deep}`;

const CAT_ORDER = ["Dinners","Desserts","Breakfast","Other"];
const slugify = s => s.toLowerCase().replace(/[^a-z0-9]+/g,"-");
const fullTitle = r => r.title + (r.title2 ? " " + r.title2 : "");
function catsInOrder(){
  return [...new Set(RECIPES.map(r => r.category))].sort((a,b) => {
    const ia = CAT_ORDER.indexOf(a), ib = CAT_ORDER.indexOf(b);
    return (ia < 0 ? 90 : ia) - (ib < 0 ? 90 : ib) || a.localeCompare(b);
  });
}
const inCat = c => RECIPES.filter(r => r.category === c)
  .sort((a,b) => fullTitle(a).localeCompare(fullTitle(b)));

/* ---- favourites: stored in this browser only ---- */
const FAV_KEY = "recipebox.favourites";
let favMem = null;
function favList(){
  if (favMem) return favMem;
  try { favMem = JSON.parse(localStorage.getItem(FAV_KEY)) || []; }
  catch(e){ favMem = []; }
  if (!Array.isArray(favMem)) favMem = [];
  return favMem;
}
const isFav = id => favList().indexOf(id) !== -1;
function toggleFav(id){
  const l = favList(), i = l.indexOf(id);
  if (i === -1) l.push(id); else l.splice(i,1);
  try { localStorage.setItem(FAV_KEY, JSON.stringify(l)); } catch(e){}
  return isFav(id);
}
const favRecipes = () => favList()
  .map(id => RECIPES.find(r => r.id === id)).filter(Boolean)
  .sort((a,b) => fullTitle(a).localeCompare(fullTitle(b)));

function favButton(id, big){
  const on = isFav(id);
  return `<button type="button" class="fav${big ? " big" : ""}" data-fav="${id}" aria-pressed="${on}"
    aria-label="${on ? "Remove from favourites" : "Add to favourites"}"
    title="${on ? "Remove from favourites" : "Add to favourites"}">${on ? "★" : "☆"}${big ? (on ? " Favourite" : " Favourite") : ""}</button>`;
}

function tile(r){
  const t = THEMES[r.theme];
  return `<div class="tilewrap" style="${themeVars(t)}">
    <a class="tile" href="#/${r.id}" title="${r.blurb.replace(/"/g,"&quot;")}">
      <div class="top"><svg class="thumb" viewBox="0 0 400 258" aria-hidden="true">${SCENE[r.scene](t)}</svg></div>
      <div class="body"><h3>${fullTitle(r)}</h3><span class="chip">${r.tags[1] || r.tags[0]}</span></div>
    </a>
    ${favButton(r.id)}
  </div>`;
}

function renderIndex(){
  document.body.classList.remove("show-sheet");
  const cats = catsInOrder();
  const favs = favRecipes();
  app.innerHTML = `
    <div class="bar">
      <span class="brand"><svg viewBox="0 0 32 32"><use href="#i-pot"/></svg> The Recipe Box</span>
      <span class="brand" style="opacity:.55;font-weight:600">${RECIPES.length} recipes</span>
    </div>
    <div class="masthead">
      <h1>The Recipe<br>Box</h1>
      <p>Everything worth cooking twice, stripped of the life story and the ads. Tap a tile, scale the servings, print an A4 sheet for the fridge.</p>
    </div>
    <div class="home">
      <details class="side"${window.matchMedia("(min-width:900px)").matches ? " open" : ""}>
        <summary>Find a recipe</summary>
        <div class="sidebody">
        ${favs.length ? `<details class="sidegroup" open>
            <summary>★ Favourites <small>${favs.length}</small></summary>
            <ul class="sidelist">${favs.map(r => `<li><a href="#/${r.id}">${fullTitle(r)}</a></li>`).join("")}</ul>
          </details>` : ""}
        ${cats.map(c => {
          const list = inCat(c);
          return `<details class="sidegroup" open>
            <summary>${c} <small>${list.length}</small></summary>
            <ul class="sidelist">${list.map(r => `<li><a href="#/${r.id}">${fullTitle(r)}</a></li>`).join("")}</ul>
          </details>`;
        }).join("")}</div>
      </details>
      <div>
        ${favs.length ? `
        <p class="cat fav-cat" id="cat-favourites">★ Favourites</p>
        <div class="grid">${favs.map(tile).join("")}</div>` : `
        <p class="cat">Favourites</p>
        <p class="favhint">Tap the ☆ on any recipe to pin it here. Saved in this browser.</p>`}
        ${cats.map(c => `
        <p class="cat" id="cat-${slugify(c)}">${c}</p>
        <div class="grid">${inCat(c).map(tile).join("")}</div>`).join("")}
      </div>
    </div>
  `;
  window.scrollTo(0,0);
}

function renderRecipe(r){
  const t = THEMES[r.theme];
  if (servesState[r.id] === undefined) servesState[r.id] = r.base;
  app.innerHTML = `
    <div class="bar" style="${themeVars(t)}">
      <a class="brand" href="#/"><svg viewBox="0 0 32 32"><use href="#${r.icon}"/></svg> ← All recipes</a>
      <span style="display:flex;gap:8px">${favButton(r.id, true)}<button class="btn" id="toSheet">A4 print sheet</button></span>

    <article class="card" style="${themeVars(t)}">
      <header class="hero">

      <section class="section">

      <section class="section">

        <p class="sub">${r.methodIntro}</p>
        <ol class="steps">${r.steps.map(s => `
          <li><div class="step"><h3>${s.h}</h3><p>${s.t}</p>

    <article class="sheet" style="${themeVars(t)}">

        <p>${r.sheetMeta} · Serves <span id="sheetServes"></span></p>
      </div>
      <div class="sheet-cols">
        <div><h3>Ingredients</h3><div id="sheetIngHost"></div></div>
        <div>
          <h3>Method</h3>
          <ol class="sheet-steps">${r.steps.map(s => `<li><b>${s.h}${s.time ? " — " + s.time : ""}</b>${s.t}</li>`).join("")}</ol>
          <h3 style="margin-top:12px">Notes</h3>
          <p style="font-size:12px;margin:0">${r.sheetNotes}</p>
        </div>
      </div>
      <a class="backlink" id="toCard">← Back to the full card</a>
    </article>
  `;

  const paint = () => {
    const serves = servesState[r.id];
    const scale = a => a * serves / r.base;
    document.getElementById("ingHost").innerHTML = r.groups.map(g => `
      <p class="grouptitle">${g.name}</p>
      <ul class="ings">${g.items.map(i => `
        <li class="ing">
          <span class="pic"><svg aria-hidden="true"><use href="#${i.icon}"/></svg></span>
          <span class="txt"><span class="amt">${i.amt ? fmt(scale(i.amt), i.unit, i.round) : "to taste"}</span>
          ${i.name}${i.opt ? ' <span class="opt">(optional)</span>' : ""}</span>
        </li>`).join("")}</ul>`).join("");
    document.getElementById("sheetIngHost").innerHTML = r.groups.map(g => `
      <h3 style="font-size:13px;margin:8px 0 4px">${g.name}</h3>
      <ul class="sheet-list">${g.items.map(i =>
        `<li><b>${i.amt ? fmt(scale(i.amt), i.unit, i.round) : ""}</b> ${i.name}${i.opt ? " (optional)" : ""}</li>`).join("")}</ul>`).join("");
    document.getElementById("servesOut").textContent = serves;
    document.getElementById("factServes").textContent = serves;
    document.getElementById("sheetServes").textContent = serves;
    document.getElementById("minus").disabled = serves <= r.min;
    document.getElementById("plus").disabled = serves >= r.max;
  };
  paint();

  document.getElementById("minus").addEventListener("click", () => { servesState[r.id] = Math.max(r.min, servesState[r.id] - r.step); paint(); });
  document.getElementById("plus").addEventListener("click", () => { servesState[r.id] = Math.min(r.max, servesState[r.id] + r.step); paint(); });
  document.getElementById("toSheet").addEventListener("click", () => {
    document.body.classList.add("show-sheet"); window.scrollTo(0,0);
    setTimeout(() => window.print(), 250);
  });
  document.getElementById("toCard").addEventListener("click", () => {
    document.body.classList.remove("show-sheet"); window.scrollTo(0,0);
  });
  window.scrollTo(0,0);
}

function route(){
  const id = (location.hash || "#/").replace(/^#\/?/, "").replace(/\/$/, "");
  const r = RECIPES.find(x => x.id === id);
  document.body.classList.remove("show-sheet");
  if (r) renderRecipe(r); else renderIndex();
}
app.addEventListener("click", e => {
  const b = e.target.closest("[data-fav]");
  if (!b) return;
  e.preventDefault();
  const id = b.getAttribute("data-fav");
  const on = toggleFav(id);
  const current = (location.hash || "#/").replace(/^#\/?/, "").replace(/\/$/, "");
  if (current === id){
    b.setAttribute("aria-pressed", on);
    b.setAttribute("aria-label", on ? "Remove from favourites" : "Add to favourites");
    b.textContent = (on ? "\u2605" : "\u2606") + " Favourite";
  } else {
    const y = window.scrollY;
    renderIndex();
    window.scrollTo(0, y);
  }
});

window.addEventListener("hashchange", route);
route();
</script>
